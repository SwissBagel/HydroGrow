            </select>
          </div>
        </div>
        <div>
          <div class="detail-label">Plant Date</div>
          <input id="jDate" type="date" value="${today}" style="padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text);font-size:14px">
        </div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button onclick="const n=document.getElementById('jName').value;const cr=document.getElementById('jCrop').value;const sy=document.getElementById('jSys').value;const d=document.getElementById('jDate').value;if(!n.trim()){alert('Give your grow a name');return;}startNewGrow(n.trim(),cr,sy,d)" style="padding:10px 24px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:600;font-size:14px;cursor:pointer">Start Grow</button>
          <button onclick="state.journalView='list';render()" style="padding:10px 24px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);font-size:14px;cursor:pointer">Cancel</button>
        </div>
      </div>
    </div>`;
}

function renderGrowDetail(grow) {
  const crop = CROPS.find(cr => cr.id === grow.cropId) || CROPS[0];
  const sys = SYSTEMS.find(s => s.id === grow.systemId) || SYSTEMS[0];
  const stage = getGrowStage(grow);
  const ideal = getIdealForStage(crop, stage.stage);
  const chartMetric = state.journalChart || "pH";

  // Adjust ideal ranges for equipment
  const fanBonus = grow.hasFan ? (grow.hasAirstone ? 8 : 5) : 0;
  const airstoneBonus = grow.hasAirstone ? (grow.hasFan ? 6 : 4) : 0;
  const adjAirTemp = [crop.aTemp[0], crop.aTemp[1] + fanBonus];
  const adjWaterTemp = [crop.wTemp[0], crop.wTemp[1] + airstoneBonus];

  const chartConfigs = {
    pH: {range: ideal.pH, label:"pH", unit:"", color:"var(--primary)"},
    ec: {range: ideal.ec, label:"EC", unit:"mS/cm", color:"var(--accent)"},
    waterTemp: {range: state.tempUnit==='C'?[toC(adjWaterTemp[0]),toC(adjWaterTemp[1])]:adjWaterTemp, label:"Water", unit:tempUnit(), color:"var(--water)"},
    airTemp: {range: state.tempUnit==='C'?[toC(adjAirTemp[0]),toC(adjAirTemp[1])]:adjAirTemp, label:"Air", unit:tempUnit(), color:"#8a6aaf"},
  };
  const cc = chartConfigs[chartMetric];

  const entries = grow.entries.slice().sort((a,b) => new Date(a.date) - new Date(b.date));

  function entryRow(e) {
    const d = new Date(e.date);
    const dateStr = d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    const phOk = e.pH >= ideal.pH[0] && e.pH <= ideal.pH[1];
    const ecOk = e.ec >= ideal.ec[0] && e.ec <= ideal.ec[1];
    const wtOk = e.waterTemp >= crop.wTemp[0] && e.waterTemp <= crop.wTemp[1] + (grow.hasAirstone?(grow.hasFan?6:4):0);
    const atOk = e.airTemp >= crop.aTemp[0] && e.airTemp <= crop.aTemp[1] + (grow.hasFan?(grow.hasAirstone?8:5):0);
    return `<tr>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted);white-space:nowrap">${dateStr}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;color:${phOk?'var(--primary)':'var(--danger-text)'}">${e.pH?((phOk?'':'⚠ ')+e.pH):"-"}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;color:${ecOk?'var(--accent)':'var(--danger-text)'}">${e.ec?((ecOk?'':'⚠ ')+e.ec):"-"}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;color:${wtOk?'var(--water)':'var(--danger-text)'}">${e.waterTemp?((wtOk?'':'⚠ ')+tempStr(e.waterTemp)):"-"}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;color:${atOk?'#8a6aaf':'var(--danger-text)'}">${e.airTemp?((atOk?'':'⚠ ')+tempStr(e.airTemp)):"-"}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text);max-width:200px;overflow:hidden;text-overflow:ellipsis">${e.notes||""}</td>
      <td style="padding:8px 6px;border-bottom:1px solid var(--border)"><button onclick="showConfirm('Delete this entry?',()=>deleteEntry('${grow.id}','${e.id}'))" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:4px;line-height:1;transition:all .15s" title="Delete entry" aria-label="Delete entry" onmouseover="this.style.background='var(--danger-bg)';this.style.color='var(--danger-text)'" onmouseout="this.style.background='none';this.style.color='var(--text-muted)'">&times;</button></td>
    </tr>`;
  }

  document.getElementById("mainContent").innerHTML = `
    <div class="mc">
      <!-- Header -->
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <div style="display:flex;align-items:center;gap:12px">
          <button onclick="state.journalView='list';state.journalGrowId=null;render()" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);cursor:pointer;font-size:13px">&larr; Back</button>
          <span style="font-size:30px">${crop.icon}</span>
          <div>
            <div style="font-size:18px;font-weight:700">${grow.name}</div>
            <div style="font-size:12px;color:var(--text-muted)">${crop.name} / ${sys.short} / Day ${stage.day} / ${stage.stage}</div>
          </div>
        </div>
        <div style="display:flex;gap:6px">
          ${grow.status==="active"?`<button onclick="completeGrow('${grow.id}')" style="padding:6px 14px;border-radius:6px;border:1px solid var(--primary);background:transparent;color:var(--primary);font-size:12px;cursor:pointer;font-weight:600">Mark Complete</button>`:`<button onclick="reactivateGrow('${grow.id}')" style="padding:6px 14px;border-radius:6px;border:1px solid var(--primary);background:transparent;color:var(--primary);font-size:12px;cursor:pointer;font-weight:600">Reactivate</button>`}
          <button onclick="deleteGrow('${grow.id}')" style="padding:6px 14px;border-radius:6px;border:1px solid var(--danger-text);background:transparent;color:var(--danger-text);font-size:12px;cursor:pointer;font-weight:600">Delete</button>
        </div>
      </div>

      <!-- Ideal ranges for current stage -->
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:20px">
        <div class="detail-item"><div class="detail-label">Stage pH</div><div class="detail-val mono" style="color:var(--primary)">${ideal.pH[0]}-${ideal.pH[1]}</div></div>
        <div class="detail-item"><div class="detail-label">Stage EC</div><div class="detail-val mono" style="color:var(--accent)">${ideal.ec[0]}-${ideal.ec[1]}</div><div style="font-size:10px;color:var(--text-muted)">${ecToPpm(ideal.ec[0])}-${ecToPpm(ideal.ec[1])} PPM</div></div>
        <div class="detail-item"><div class="detail-label">Water Temp${grow.hasAirstone?" \u{2728}":""}</div><div class="detail-val mono" style="color:var(--water)">${tempRange(crop.wTemp[0],crop.wTemp[1]+airstoneBonus)}</div></div>
        <div class="detail-item"><div class="detail-label">Air Temp${grow.hasFan?" \u{2728}":""}</div><div class="detail-val mono" style="color:#8a6aaf">${tempRange(crop.aTemp[0],crop.aTemp[1]+fanBonus)}</div></div>
      </div>

      <!-- Equipment Toggles -->
      <div style="display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);cursor:pointer;font-size:13px;font-weight:500;color:var(--text)">
          <input type="checkbox" id="jFan" ${grow.hasFan?"checked":""} onchange="const fv={ph:document.getElementById('ePh')?.value,ec:document.getElementById('eEc')?.value,wt:document.getElementById('eWt')?.value,at:document.getElementById('eAt')?.value,notes:document.getElementById('eNotes')?.value,date:document.getElementById('eDate')?.value};const gs=loadGrows();const g=gs.find(x=>x.id==='${grow.id}');if(g){g.hasFan=this.checked;saveGrows(gs);}render();setTimeout(()=>{if(document.getElementById('ePh')){document.getElementById('ePh').value=fv.ph||'';document.getElementById('eEc').value=fv.ec||'';document.getElementById('eWt').value=fv.wt||'';document.getElementById('eAt').value=fv.at||'';document.getElementById('eNotes').value=fv.notes||'';document.getElementById('eDate').value=fv.date||'';}},10)"> 💨 Fan Running
          <span style="font-size:11px;color:var(--text-muted)">(+5°F air, +8°F with both)</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);cursor:pointer;font-size:13px;font-weight:500;color:var(--text)">
          <input type="checkbox" id="jAir" ${grow.hasAirstone?"checked":""} onchange="const fv={ph:document.getElementById('ePh')?.value,ec:document.getElementById('eEc')?.value,wt:document.getElementById('eWt')?.value,at:document.getElementById('eAt')?.value,notes:document.getElementById('eNotes')?.value,date:document.getElementById('eDate')?.value};const gs=loadGrows();const g=gs.find(x=>x.id==='${grow.id}');if(g){g.hasAirstone=this.checked;saveGrows(gs);}render();setTimeout(()=>{if(document.getElementById('ePh')){document.getElementById('ePh').value=fv.ph||'';document.getElementById('eEc').value=fv.ec||'';document.getElementById('eWt').value=fv.wt||'';document.getElementById('eAt').value=fv.at||'';document.getElementById('eNotes').value=fv.notes||'';document.getElementById('eDate').value=fv.date||'';}},10)"> 💧 Airstone Active
          <span style="font-size:11px;color:var(--text-muted)">(+4°F water, +6°F with both)</span>
        </label>
      </div>

      <!-- Add Entry Form -->
      ${grow.status==="active"?`
      <div style="background:var(--card-alt);border-radius:10px;padding:16px;border:1px solid var(--border);margin-bottom:20px">
        <div style="font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">Log a Reading</div>
        <div class="j-entry-form">
          <div><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Date/Time <span style="font-weight:400;opacity:0.7">(leave blank = now)</span></div><input id="eDate" type="datetime-local" style="width:280px;max-width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px" class="mono"></div>
          <div><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">pH</div><input id="ePh" type="number" step="0.1" min="0" max="14" placeholder="6.2" style="width:70px;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px" class="mono"></div>
          <div style="position:relative"><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">EC <span onclick="var t=document.getElementById('ecTip');t.style.display=t.style.display==='none'?'block':'none'" style="cursor:pointer;color:var(--primary);font-weight:700;font-size:13px;user-select:none" title="Click for EC info">ⓘ</span><div id="ecTip" style="display:none;position:absolute;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;box-shadow:0 4px 12px var(--shadow);width:260px;font-size:12px;color:var(--text);line-height:1.6;margin-top:4px"><strong>EC Reading Formats</strong><br><br>Some meters read in <strong>mS/cm</strong> (e.g., 1.2)<br>Others read in <strong>µS/cm</strong> (e.g., 1200)<br><br>They are the same value!<br><strong>1.2 mS/cm = 1200 µS/cm</strong><br><br>HydroGrow uses mS/cm.<br>If your meter shows 800 or 1200, divide by 1000.<br><br><em>800 µS = 0.8 mS<br>1200 µS = 1.2 mS<br>2500 µS = 2.5 mS</em></div></div><input id="eEc" type="number" step="0.1" min="0" max="10" placeholder="1.2" style="width:70px;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px" class="mono"></div>
          <div><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Water ${tempUnit()}</div><input id="eWt" type="number" step="1" min="${state.tempUnit==='C'?0:32}" max="${state.tempUnit==='C'?50:120}" placeholder="${state.tempUnit==='C'?'20':'68'}" style="width:70px;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px" class="mono"></div>
          <div><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Air ${tempUnit()}</div><input id="eAt" type="number" step="1" min="${state.tempUnit==='C'?0:32}" max="${state.tempUnit==='C'?50:120}" placeholder="${state.tempUnit==='C'?'22':'72'}" style="width:70px;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px" class="mono"></div>
          <div style="flex:1;min-width:150px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Notes</div><input id="eNotes" type="text" placeholder="Looking healthy..." style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px"></div>
          <button onclick="var _wt=parseFloat(document.getElementById('eWt').value)||null;var _at=parseFloat(document.getElementById('eAt').value)||null;if(state.tempUnit==='C'){if(_wt!==null)_wt=Math.round(_wt*9/5+32);if(_at!==null)_at=Math.round(_at*9/5+32);}addEntry('${grow.id}',{date:document.getElementById('eDate').value?new Date(document.getElementById('eDate').value).toISOString():new Date().toISOString(),pH:parseFloat(document.getElementById('ePh').value)||null,ec:parseFloat(document.getElementById('eEc').value)||null,waterTemp:_wt,airTemp:_at,notes:document.getElementById('eNotes').value})" style="padding:8px 18px;border-radius:6px;border:none;background:var(--primary);color:#fff;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;height:38px">+ Log</button>
        </div>
      </div>
      `:""}

      <!-- Chart -->
      <div style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
          <div style="font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase">Readings Over Time</div>
          <div style="display:flex;gap:4px">
            ${["pH","ec","waterTemp","airTemp"].map(m => {
              const labels = {pH:"pH",ec:"EC",waterTemp:"Water",airTemp:"Air"};
              return '<button class="'+(chartMetric===m?'sys-btn active':'sys-btn')+'" onclick="state.journalChart=\''+m+'\';render()">'+labels[m]+'</button>';
            }).join("")}
          </div>
        </div>
        <div style="background:var(--card-alt);border-radius:10px;padding:16px;border:1px solid var(--border);overflow-x:auto">
          ${drawChart(state.tempUnit==='C'&&(chartMetric==='waterTemp'||chartMetric==='airTemp')?entries.map(e=>({...e,waterTemp:e.waterTemp!=null?toC(e.waterTemp):null,airTemp:e.airTemp!=null?toC(e.airTemp):null})):entries, chartMetric, cc.range, cc.label, cc.unit, cc.color)}
        </div>
      </div>

      <!-- Entry Table -->
      ${entries.length ? `
      <div style="font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">All Entries (${entries.length})</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="border-bottom:2px solid var(--border)">
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--text-muted);font-size:11px">DATE</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--primary);font-size:11px">pH</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--accent);font-size:11px">EC</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--water);font-size:11px">WATER</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:#8a6aaf;font-size:11px">AIR</th>
            <th style="padding:8px 10px;text-align:left;font-weight:600;color:var(--text-muted);font-size:11px">NOTES</th>
            <th style="padding:8px 6px"></th>
          </tr></thead>
          <tbody>${entries.slice().reverse().map(entryRow).join("")}</tbody>
        </table>
      </div>
      ` : `<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px">No entries yet. Log your first reading above.</div>`}
    </div>`;
}


initSelectors();render();
</script>
</body>
</html>
