<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HydroGrow — Hydroponic Assistant v22</title>
<style>
  :root {
    --bg:#f2f0eb;--card:#ffffff;--card-alt:#f8f7f4;--primary:#3a6b35;--primary-light:#e8f0e7;--primary-dark:#2a4d27;
    --accent:#b8860b;--accent-light:#fdf6e3;--text:#2d3b2d;--text-muted:#6b7d6b;--border:#ddd8cd;
    --tag-bg:#e8f0e7;--tag-text:#3a6b35;--shadow:rgba(45,59,45,0.08);--water:#4a8fa8;--water-bg:#e8f4f8;
    --danger-bg:#fdf0ed;--danger-text:#a94442;--header-bg:#3a6b35;--header-text:#f2f0eb;
  }
  [data-theme="dark"] {
    --bg:#1a2119;--card:#232e23;--card-alt:#2a382a;--primary:#6aaf65;--primary-light:#2a3d28;--primary-dark:#8fcc8a;
    --accent:#d4a828;--accent-light:#3a3520;--text:#dce5dc;--text-muted:#8fa88f;--border:#3a4a3a;
    --tag-bg:#2a3d28;--tag-text:#8fcc8a;--shadow:rgba(0,0,0,0.3);--water:#6ab4cc;--water-bg:#1f3540;
    --danger-bg:#3a2525;--danger-text:#e8a0a0;--header-bg:#232e23;--header-text:#dce5dc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;min-height:100vh;}
  button{cursor:pointer;font-family:inherit;} select,input{font-family:inherit;}
  .header{background:var(--header-bg);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo span:last-child{font-weight:700;font-size:18px;color:var(--header-text);letter-spacing:-0.3px;}
  .nav-btns{display:flex;align-items:center;gap:4px;}
  .nav-btn{padding:8px 18px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,0.6);font-weight:500;font-size:14px;transition:all .15s;white-space:nowrap;}
  .nav-btn.active{background:var(--primary-light);color:var(--primary);font-weight:700;}
  [data-theme="dark"] .nav-btn{color:var(--text-muted);}
  [data-theme="dark"] .nav-btn.active{color:var(--primary);background:var(--primary-light);}
  .theme-btn{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:var(--header-text);font-size:13px;font-weight:500;}
  [data-theme="dark"] .theme-btn{border-color:#4a5a4a;}
  .selector-bar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;}
  .selector-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .sel-group{display:flex;align-items:center;gap:8px;}
  .sel-label{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;}
  .sel-select{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text);font-size:14px;font-weight:500;min-width:180px;}
  .sys-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;min-width:280px;}
  .sys-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);transition:all .15s;text-align:center;white-space:nowrap;}
  .sys-btn.active{border:2px solid var(--primary);background:var(--primary-light);color:var(--primary);font-weight:700;}
  .cheat-btn{padding:8px 18px;border-radius:8px;border:1px solid var(--primary);background:transparent;color:var(--primary);font-weight:600;font-size:13px;margin-left:auto;}
  .crop-header{max-width:1200px;margin:0 auto;padding:20px 24px 0;display:flex;align-items:center;gap:14px;}
  .crop-icon{font-size:36px;} .crop-title{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
  .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;background:var(--tag-bg);color:var(--tag-text);}
  .tag.blue{background:var(--water-bg);color:var(--water);} .tag.gold{background:var(--accent-light);color:var(--accent);}
  .content{max-width:1200px;margin:0 auto;padding:16px 24px 40px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .full-width{grid-column:1/-1;}
  .mc{background:var(--card);border-radius:12px;padding:20px 22px;border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow);}
  .mc-h{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .mc-l{font-weight:600;font-size:14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;}
  .mono{font-family:'SF Mono','Cascadia Code','Consolas',monospace;}
  .big-num{font-size:28px;font-weight:700;} .med-num{font-size:20px;font-weight:700;}
  .small-note{font-size:12px;color:var(--text-muted);margin-top:4px;}
  .range-bar{margin-bottom:8px;} .range-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;}
  .range-row{display:flex;align-items:center;gap:10px;}
  .range-track{flex:1;height:8px;border-radius:4px;background:var(--card-alt);overflow:hidden;position:relative;}
  .range-fill{position:absolute;left:10%;right:10%;top:0;bottom:0;border-radius:4px;opacity:0.7;}
  .range-val{font-size:15px;font-weight:600;min-width:90px;text-align:right;}
  .stage-cards{display:flex;gap:12px;flex-wrap:wrap;}
  .stage-card{flex:1 1 180px;background:var(--card-alt);border-radius:8px;padding:12px 16px;}
  .stage-text{font-size:13px;margin-top:8px;} .note-text{font-size:14px;line-height:1.6;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .detail-item{background:var(--card-alt);border-radius:8px;padding:12px 14px;}
  .detail-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:4px;}
  .detail-val{font-size:15px;font-weight:600;}
  .detail-note{font-size:11px;color:var(--text-muted);margin-top:3px;}
  .planner-card{background:var(--card);border-radius:12px;padding:24px;border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow);margin-bottom:16px;}
  .date-row{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .date-input{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text);font-size:14px;}
  .timeline{position:relative;padding-left:24px;}
  .timeline-line{position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--border);}
  .milestone{position:relative;padding-left:28px;min-height:48px;}
  .ms-dot{position:absolute;left:-18px;top:4px;width:14px;height:14px;border-radius:50%;border:3px solid var(--card);}
  .ms-label{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
  .ms-date{font-size:15px;font-weight:600;margin-top:4px;}
  .ms-day{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .ms-desc{font-size:12px;color:var(--text-muted);margin-top:4px;font-style:italic;max-width:500px;}
  .summary-box{margin-top:24px;padding:16px;background:var(--primary-light);border-radius:8px;border:1px solid var(--border);}
  .summary-title{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:6px;}
  .summary-text{font-size:14px;}
  .export-card{background:var(--card);border-radius:12px;padding:24px;border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow);}
  .freq-btns{display:flex;gap:4px;flex-wrap:wrap;}
  .freq-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);transition:all .15s;}
  .freq-btn.active{border:2px solid var(--primary);background:var(--primary-light);color:var(--primary);font-weight:700;}
  .export-preview{background:var(--card-alt);border-radius:8px;padding:14px;margin:16px 0;border:1px solid var(--border);}
  .export-btn{padding:12px 28px;border-radius:8px;border:none;font-weight:600;font-size:14px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:all .2s;}
  .export-btn:hover{opacity:0.9;} .export-btn.done{background:var(--primary-dark);}

  /* Focus styles for keyboard accessibility */
  .nav-btn:focus-visible,.theme-btn:focus-visible,.sys-btn:focus-visible,.cheat-btn:focus-visible,
  .freq-btn:focus-visible,.export-btn:focus-visible,.print-btn:focus-visible,
  button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
  select:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}

  /* Styled confirm dialog */
  .confirm-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease;}
  .confirm-box{background:var(--card);border-radius:12px;padding:28px;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.3);border:1px solid var(--border);text-align:center;}
  .confirm-msg{font-size:15px;font-weight:500;color:var(--text);margin-bottom:20px;line-height:1.5;}
  .confirm-btns{display:flex;gap:10px;justify-content:center;}
  .confirm-cancel{padding:10px 22px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);font-weight:600;font-size:13px;cursor:pointer;}
  .confirm-danger{padding:10px 22px;border-radius:8px;border:none;background:var(--danger-text);color:#fff;font-weight:600;font-size:13px;cursor:pointer;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-content{background:var(--card);color:var(--text);border-radius:12px;padding:32px;max-width:700px;width:100%;max-height:90vh;overflow:auto;position:relative;}
  .modal-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:22px;color:var(--text-muted);cursor:pointer;}
  .ct{width:100%;border-collapse:collapse;font-size:13px;} .ct td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text);}
  .ct td:first-child{font-weight:600;color:var(--primary);width:35%;}
  .cs-t{font-size:12px;font-weight:600;color:var(--primary);text-transform:uppercase;margin:16px 0 6px;}
  .cs-b{font-size:13px;color:var(--text);line-height:1.6;}
  .print-btn{padding:10px 28px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin-top:20px;}
  @media print{body>*:not(#modalRoot){display:none!important;}#modalRoot{display:block!important;}#modalRoot .modal-overlay{position:static!important;background:none!important;padding:0!important;}#modalRoot .modal-content{max-height:none!important;box-shadow:none!important;border:none!important;max-width:100%!important;}#modalRoot .modal-close,#modalRoot .print-btn{display:none!important;}}
  @media(max-width:768px){
    .header-inner{flex-wrap:wrap;height:auto;padding:10px 0;gap:8px;}
    .nav-btns{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none;}
    .nav-btns::-webkit-scrollbar{display:none;}
    .nav-btn{padding:8px 14px;font-size:13px;flex-shrink:0;}
    .header .theme-btn{font-size:12px;padding:5px 10px;}
    .selector-inner{flex-direction:column;align-items:stretch;}
    .sys-btns{min-width:0!important;width:100%;grid-template-columns:repeat(4,1fr);}
    .sys-btn{padding:6px 8px;font-size:11px;}
    .cheat-btn{margin-left:0;margin-top:4px;width:100%;text-align:center;}
    .sel-select{width:100%;min-width:0;}
    .grid{grid-template-columns:1fr;}
    .crop-header{flex-wrap:wrap;padding:16px 16px 0;}
    .content{padding:12px 16px 32px;}
    .detail-grid{grid-template-columns:1fr;}
    .crop-title{font-size:22px;}
    .stage-cards{flex-direction:column;}
    .modal-content{padding:20px 16px;border-radius:8px;}
    .planner-card{padding:16px;}
    .date-row{flex-direction:column;gap:8px;}
    .freq-btns{width:100%;}
    .freq-btn{flex:1;text-align:center;}
  }
  @media(max-width:480px){
    .nav-btn{padding:7px 12px;font-size:12px;}
    .sys-btns{grid-template-columns:repeat(2,1fr);}
    .big-num{font-size:24px;}
    .mc{padding:16px 14px;}
  }

  .sys-btn:hover{background:var(--primary-light);color:var(--primary);}

  /* Journal entry form responsive */
  .j-entry-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  @media(max-width:768px){
    .j-entry-form{flex-direction:column;align-items:stretch;}
    .j-entry-form>div{width:100%!important;min-width:0!important;}
    .j-entry-form input[type="number"]{width:100%!important;}
    .j-entry-form input[type="datetime-local"]{width:100%!important;}
    .j-entry-form button{width:100%;height:44px!important;}
  }

  input[type="number"]::-webkit-inner-spin-button{opacity:0.5;}
</style>
</head>
<body>
<div class="header"><div class="header-inner">
  <div class="logo"><span style="font-size:22px">🌱</span><span>HydroGrow</span></div>
  <div class="nav-btns">
    <button class="nav-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" onclick="switchTab('planner')">📅 Planner</button>
    <button class="nav-btn" onclick="switchTab('calculator')">🧪 Calculator</button>
    <button class="nav-btn" onclick="switchTab('companions')">🌿 Companions</button>
    <button class="nav-btn" onclick="switchTab('diagnose')">Diagnose</button>
    <button class="nav-btn" onclick="switchTab('journal')">📓 Journal</button>
  </div>
  <button class="theme-btn" id="tempUnitBtn" onclick="state.tempUnit=state.tempUnit==='F'?'C':'F';document.getElementById('tempUnitBtn').textContent=state.tempUnit==='F'?'°F → °C':'°C → °F';render()">°F → °C</button> <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 Dark</button>
</div></div>
<div class="selector-bar"><div class="selector-inner">

  <div class="sel-group"><label class="sel-label">System</label><div class="sys-btns" id="sysBtns"></div></div>
  <button class="cheat-btn" onclick="showCheatSheet()">📋 Cheat Sheet</button>
</div></div>
<div class="crop-header" id="cropHeader"></div>
<div class="content" id="mainContent"></div>
<div id="modalRoot"></div>

      aero:{tank:"1–2 gal per 5–6 plants",pump:"Low pressure fine",cycle:"Mist 5 sec every 4–5 min",flow:"Fine mist",waterChange:"Top off as needed. Full change after stage transitions or if pH/EC becomes unstable.",ecAdj:"Reduce EC by 10–15%.",notes:"Works well, quick growth. But DWC is just as easy and cheaper for this crop."},aio:{tank:"Integrated reservoir, 0.5–1 gal shared",pump:"Built-in — integrated pump and aeration",cycle:"Automatic",waterChange:"Top off every 2–3 days.",ecAdj:"Kit nutrients at standard dose.",notes:"💨 Adding a small clip-on fan (for airflow) and a supplemental USB air stone (for extra oxygenation) dramatically improves yields in any kit — both are under $15 and plug right in. Great kit crop. Very compact and unobtrusive — won’t bother neighbors. Pro tip: skip seeds and just put store-bought green onion root ends directly into the pod. They’ll regrow in days. Cut-and-come-again 2–3 times."},kratky:{tank:"1-2 gal per plant",pump:"None (passive)",circ:"None",cycle:"No cycling",waterChange:"None - single-fill grow",ecAdj:"Standard EC",notes:"Excellent Kratky crop. Very low maintenance."},tower:{tank:"15-25 gal reservoir",pump:"200-400 GPH",cycle:"Continuous drip during lights-on",flow:"Continuous flow",waterChange:"Top off frequently",ecAdj:"Standard EC",notes:"Good tower crop. Compact and low-maintenance."}
    },fit:{dwc:4,nft:4,ebb:3,drip:3,aero:3,aio:4,kratky:4,tower:3}},
];

const SYSTEMS = [
  {id:"dwc",name:"Deep Water Culture (DWC)",short:"DWC"},
  {id:"nft",name:"Nutrient Film Technique (NFT)",short:"NFT"},
  {id:"ebb",name:"Ebb & Flow",short:"Ebb & Flow"},
  {id:"drip",name:"Drip System",short:"Drip"},
  {id:"aero",name:"Aeroponics",short:"Aero"},
  {id:"aio",name:"All-in-One Kit",short:"All-in-One"},
  {id:"kratky",name:"Kratky Method",short:"Kratky"},
  {id:"tower",name:"Vertical Tower",short:"Tower"},
];
const CATEGORIES=["Leafy Greens","Herbs","Fruiting","Specialty"];

let state={crop:"lettuce",system:"dwc",tab:"dashboard",dark:false,plantDate:new Date().toISOString().split("T")[0],reminderFreq:"3",tankSize:"3",calcStage:"seedling",nutSystem:"3part",tempUnit:"F",tapEC:"0",lightSource:"led",diagnosePath:[]};
function setState(k,v){state[k]=v;render();}
function getCrop(){return CROPS.find(c=>c.id===state.crop);}
function getSys(){return SYSTEMS.find(s=>s.id===state.system);}

function initSelectors(){
  const sel=document.getElementById("cropSelect");
  sel.innerHTML=CATEGORIES.map(cat=>{const items=CROPS.filter(c=>c.cat===cat);if(!items.length)return"";return`<optgroup label="${cat}">${items.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join("")}</optgroup>`;}).join("");
  sel.value=state.crop;renderSysBtns();
}
function renderSysBtns(){document.getElementById("sysBtns").innerHTML=SYSTEMS.map(s=>`<button class="sys-btn ${state.system===s.id?'active':''}" onclick="setState('system','${s.id}')">${s.short}</button>`).join("");}
function switchTab(t){state.tab=t;if(t==="diagnose")state.diagnosePath=[];document.querySelectorAll(".nav-btn").forEach((b,i)=>{b.classList.toggle("active",(i===0&&t==="dashboard")||(i===1&&t==="planner")||(i===2&&t==="calculator")||(i===3&&t==="companions")||(i===4&&t==="diagnose")||(i===5&&t==="journal"));});render();window.scrollTo(0,0);}
function toggleTheme(){state.dark=!state.dark;document.documentElement.setAttribute("data-theme",state.dark?"dark":"");document.getElementById("themeToggleBtn").textContent=state.dark?"\u2600\uFE0F Light":"\uD83C\uDF19 Dark";}
function toC(f){return Math.round((f-32)*5/9);}
function tempVal(f){return state.tempUnit==="C"?toC(f):f;}
function tempStr(f){return state.tempUnit==="C"?toC(f)+"°C":f+"°F";}
function tempRange(lo,hi){return state.tempUnit==="C"?toC(lo)+"–"+toC(hi)+"°C":lo+"–"+hi+"°F";}
function tempUnit(){return state.tempUnit==="C"?"°C":"°F";}
function ecToPpm(ec){return Math.round(ec*500);}
function ecPpmStr(ec){return ec+" mS/cm ("+ecToPpm(ec)+" PPM)";}
function ecRangePpm(lo,hi){return lo+"–"+hi+" mS/cm ("+ecToPpm(lo)+"–"+ecToPpm(hi)+" PPM)";}
function addDays(ds,d){const dt=new Date(ds+"T12:00:00");dt.setDate(dt.getDate()+d);return dt;}
function fmtDate(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function icsDate(d){return`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;}
function icsDateTime(d,h){return`${icsDate(d)}T${String(h||9).padStart(2,"0")}0000`;}

function getMilestones(){
  const c=getCrop(),sys=getSys();
  const m=[
    {label:"Planted",startDay:0,endDay:0,color:"var(--primary)",desc:`Plant ${c.name} in your ${sys.short} system. Initial setup — add seedling-strength nutrients.`},
    {label:"Germination Complete",startDay:c.germ[0],endDay:c.germ[1],color:"#6aaf65",desc:`${c.name} should be sprouted. Check for healthy seedlings and thin if needed.`},
  ];
  if(c.trans[1]>0) m.push({label:"Transplant Ready",startDay:c.trans[0],endDay:c.trans[1],color:"var(--water)",desc:`Seedlings ready for transplant into main ${sys.short} system. Move to vegetative nutrient strength.`});
  m.push({label:"First Harvest",startDay:c.harvest[0],endDay:c.harvest[0],color:"var(--accent)",desc:`${c.name} should be ready for first harvest!`});
  m.push({label:"Peak Harvest Window",startDay:c.harvest[0],endDay:c.harvest[1],color:"#b8860b",desc:`Peak harvest period. Harvest regularly for best quality.`});
  return m.map(ms=>({...ms,startDate:addDays(state.plantDate,ms.startDay),endDate:addDays(state.plantDate,ms.endDay)}));
}

function mc(icon,title,content,full){return`<div class="mc${full?' full-width':''}"><div class="mc-h"><span style="font-size:18px">${icon}</span><span class="mc-l">${title}</span></div>${content}</div>`;}

function detailItem(label,val,note){return`<div class="detail-item"><div class="detail-label">${label}</div><div class="detail-val">${val}</div>${note?`<div class="detail-note">${note}</div>`:''}</div>`;}

function tempBar(lo, hi, scaleMin, scaleMax, colorLo, colorHi, tolHi) {
  const range = scaleMax - scaleMin;
  const leftPct = ((lo - scaleMin) / range * 100).toFixed(1);
  const widthPct = ((hi - lo) / range * 100).toFixed(1);
  const ticks = [];
  for (let t = scaleMin; t <= scaleMax; t += 5) {
    const pct = ((t - scaleMin) / range * 100).toFixed(1);
    const isEdge = t === scaleMin || t === scaleMax;
    const isMajor = t % 10 === 0;
    if (isMajor || isEdge) ticks.push({pct, label: t + "°", isMajor});
  }
  const tolLeftPct = ((hi - scaleMin) / range * 100).toFixed(1);
  const tolWidthPct = tolHi ? (((tolHi - hi) / range) * 100).toFixed(1) : 0;
  return `<div style="margin-top:12px">
    <div style="position:relative;height:28px;border-radius:6px;background:linear-gradient(90deg,${colorLo},${colorHi});overflow:hidden">
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.25);border-radius:6px"></div>
      ${tolHi?`<div style="position:absolute;top:0;bottom:0;left:${tolLeftPct}%;width:${tolWidthPct}%;background:linear-gradient(90deg,rgba(218,165,32,0.6),rgba(218,165,32,0.3));border-radius:0 4px 4px 0;border:2px dashed rgba(218,165,32,0.7);border-left:none"></div>`:""}
      <div style="position:absolute;top:0;bottom:0;left:${leftPct}%;width:${widthPct}%;background:linear-gradient(90deg,${colorLo},${colorHi});border-radius:4px;border:2px solid rgba(255,255,255,0.8);box-shadow:0 0 8px rgba(255,255,255,0.3)"></div>
      <div style="position:absolute;left:${leftPct}%;top:50%;transform:translate(-50%,-50%);font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5);z-index:2;pointer-events:none">${lo}°</div>
      <div style="position:absolute;left:${(parseFloat(leftPct)+parseFloat(widthPct)).toFixed(1)}%;top:50%;transform:translate(-50%,-50%);font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5);z-index:2;pointer-events:none">${hi}°</div>
      ${tolHi?`<div style="position:absolute;left:${(parseFloat(tolLeftPct)+parseFloat(tolWidthPct)).toFixed(1)}%;top:50%;transform:translate(-50%,-50%);font-size:8px;font-weight:600;color:rgba(218,165,32,0.9);text-shadow:0 1px 2px rgba(0,0,0,0.4);z-index:2;pointer-events:none">${tolHi}°</div>`:""}
    </div>
    <div style="position:relative;height:16px;margin-top:2px">
      ${ticks.map(t => `<span style="position:absolute;left:${t.pct}%;transform:translateX(-50%);font-size:9px;color:var(--text-muted);opacity:${t.isMajor?1:0.6}">${t.label}</span>`).join("")}
    </div>
    ${tolHi?`<div style="display:flex;gap:12px;margin-top:2px;font-size:10px">
      <span style="color:var(--text-muted)"><span style="display:inline-block;width:10px;height:6px;border-radius:2px;background:${colorLo};margin-right:3px;vertical-align:middle"></span>Ideal</span>
      <span style="color:var(--text-muted)"><span style="display:inline-block;width:10px;height:6px;border-radius:2px;background:rgba(218,165,32,0.6);border:1px dashed rgba(218,165,32,0.7);margin-right:3px;vertical-align:middle"></span>OK with fan + airstone</span>
    </div>`:""}
  </div>`;
}

function lightBar(hoursOn) {
  const hoursOff = 24 - hoursOn;
  const onPct = (hoursOn / 24 * 100).toFixed(1);
  return `<div style="margin-top:12px">
    <div style="display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--border)">
      <div style="width:${onPct}%;background:linear-gradient(135deg,#f4d35e,#e8a628);display:flex;align-items:center;justify-content:center;gap:4px">
        <span style="font-size:11px">☀️</span><span style="font-size:11px;font-weight:700;color:#5a4106">${hoursOn}h light</span>
      </div>
      <div style="flex:1;background:linear-gradient(135deg,#2a3a5c,#1a2540);display:flex;align-items:center;justify-content:center;gap:4px">
        <span style="font-size:11px">🌙</span><span style="font-size:11px;font-weight:600;color:#8899bb">${hoursOff}h dark</span>
      </div>
    </div>
  </div>`;
}

function render(){
  const c=getCrop(),sys=getSys();
  const hideSelector = state.tab === "journal" || state.tab === "diagnose";
  document.querySelector(".selector-bar").style.display = hideSelector ? "none" : "";
  document.getElementById("cropHeader").style.display = hideSelector ? "none" : "";
  if(!hideSelector) {
  document.getElementById("cropSelect").value=state.crop;
  renderSysBtns();
  document.getElementById("cropHeader").innerHTML=`<span class="crop-icon">${c.icon}</span><div><h1 class="crop-title">${c.name}</h1><div class="tags"><span class="tag">${c.cat}</span><span class="tag blue">${sys.short}</span><span class="tag gold">${c.harvest[0]}–${c.harvest[1]} days to harvest</span></div></div>`;
  }
  if(state.tab==="dashboard") renderDashboard(c,sys);
  else if(state.tab==="planner") renderPlanner(c,sys);
  else if(state.tab==="calculator") renderCalculator(c,sys);
  else if(state.tab==="companions") renderCompanions();
  else if(state.tab==="diagnose") renderDiagnose();
  else if(state.tab==="journal") renderJournal();
}

  } else {
    sysSetupContent=`<div class="detail-grid">
      ${detailItem("Tank / Reservoir",sd.tank)}

      ${detailItem("Cycle / Timing",sd.cycle)}
      ${sd.flow?detailItem("Flow Rate",sd.flow):''}
      ${detailItem("Water Changes",sd.waterChange)}
      ${detailItem("EC Adjustments",sd.ecAdj)}
    </div>`;

  document.getElementById("mainContent").innerHTML=`<div class="grid">
    ${(function(){var f=c.fit?c.fit[state.system]:3;var labels={4:{txt:"Excellent Fit",bg:"#2d8a4e",icon:"✅",desc:"This crop thrives in this system"},3:{txt:"Good Fit",bg:"#6aaf65",icon:"✓",desc:"Works well with proper setup"},2:{txt:"Workable",bg:"#b8860b",icon:"⚠️",desc:"Possible but has known challenges"},1:{txt:"Not Recommended",bg:"#a94442",icon:"❌",desc:"Choose a different system for this crop"}};var l=labels[f]||labels[3];return `<div class="full-width" style="background:${l.bg};border-radius:12px;padding:14px 20px;color:#fff;display:flex;align-items:center;gap:14px"><span style="font-size:28px">${l.icon}</span><div><div style="font-size:16px;font-weight:700">${l.txt} — ${c.name} in ${sys.short}</div><div style="font-size:13px;opacity:0.9">${l.desc}</div>${SPEED_NOTES[c.cat]&&SPEED_NOTES[c.cat][state.system]?`<div style="font-size:12px;opacity:0.85;margin-top:4px;font-style:italic">${SPEED_NOTES[c.cat][state.system]}</div>`:""}</div></div>`})()}
    ${mc("📅","Harvest Timeline",`<div style="display:flex;gap:16px;flex-wrap:wrap">
      <div><div class="small-note" style="margin-top:0">Germination</div><div class="big-num mono" style="color:var(--primary)">${c.germ[0]}–${c.germ[1]}d</div></div>
      ${c.trans[1]>0?`<div><div class="small-note" style="margin-top:0">Transplant Ready</div><div class="big-num mono" style="color:var(--accent)">${c.trans[0]}–${c.trans[1]}d</div></div>`:''}
      <div><div class="small-note" style="margin-top:0">Harvest</div><div class="big-num mono">${c.harvest[0]}–${c.harvest[1]}d</div></div>
    </div>`)}
    ${(function(){
      var phMin=4.0,phMax=8.0,phR=phMax-phMin;
      var phL=((c.pH[0]-phMin)/phR*100).toFixed(1);
      var phW=((c.pH[1]-c.pH[0])/phR*100).toFixed(1);
      var ecMin=0,ecMax=Math.max(5,c.ec[1]+1),ecR=ecMax-ecMin;
      var ecL=((c.ec[0]-ecMin)/ecR*100).toFixed(1);
      var ecW=((c.ec[1]-c.ec[0])/ecR*100).toFixed(1);
      function scaleTicks(min,max,step){var t=[];for(var v=min;v<=max;v+=step){t.push({pct:((v-min)/(max-min)*100).toFixed(1),label:v%1===0?v.toFixed(0):v.toFixed(1)});}return t;}
      var phTicks=scaleTicks(phMin,phMax,1);
      var ecTicks=scaleTicks(ecMin,ecMax,1);
      return mc("🧪","Tank Conditions",
        '<div style="margin-bottom:16px">'
          +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="range-label" style="margin:0">pH Range</span><span class="range-val mono" style="min-width:0;text-align:right">'+c.pH[0]+'\u2013'+c.pH[1]+'</span></div>'
          +'<div class="range-track" style="position:relative;height:10px"><div class="range-fill" style="background:var(--primary);left:'+phL+'%;width:'+phW+'%;right:auto"></div></div>'
          +'<div style="position:relative;height:16px;margin-top:3px">'+phTicks.map(function(t){return '<span style="position:absolute;left:'+t.pct+'%;transform:translateX(-50%);font-size:10px;color:var(--text-muted)">'+t.label+'</span>';}).join("")+'</div>'
        +'</div>'
        +'<div style="margin-bottom:14px">'
          +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="range-label" style="margin:0">EC (mS/cm)</span><span class="range-val mono" style="min-width:0;text-align:right">'+c.ec[0]+'\u2013'+c.ec[1]+' mS <span style="font-weight:400;font-size:12px;color:var(--text-muted)">('+ecToPpm(c.ec[0])+'\u2013'+ecToPpm(c.ec[1])+' PPM)</span></span></div>'
          +'<div class="range-track" style="position:relative;height:10px"><div class="range-fill" style="background:var(--accent);left:'+ecL+'%;width:'+ecW+'%;right:auto"></div></div>'
          +'<div style="position:relative;height:16px;margin-top:3px">'+ecTicks.map(function(t){return '<span style="position:absolute;left:'+t.pct+'%;transform:translateX(-50%);font-size:10px;color:var(--text-muted)">'+t.label+'</span>';}).join("")+'</div>'
        +'</div>'
        +'<button onclick="showStageChart()" style="margin-top:4px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--primary);font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:all .15s">\u{1f4c8} View pH & EC by Growth Stage</button>');
    })()}
    ${mc("🌡️","Water Temperature",`<div class="big-num mono" style="color:var(--water)">${tempRange(c.wTemp[0],c.wTemp[1])}</div>${tempBar(tempVal(c.wTemp[0]),tempVal(c.wTemp[1]),tempVal(50),tempVal(85),"#4a8fa8","#c94a4a",tempVal(c.wTemp[1]+6))}`)}
    ${mc("🌤️","Air Temperature",`<div class="big-num mono">${tempRange(c.aTemp[0],c.aTemp[1])}</div>${tempBar(tempVal(c.aTemp[0]),tempVal(c.aTemp[1]),tempVal(50),tempVal(90),"#4aa87a","#c97a2a",tempVal(c.aTemp[1]+8))}`)}
    ${state.system==="aio"?mc("\u{1f4a1}","Light Panel Height",`<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px">Adjust intensity by raising or lowering your light panel. Measure distance from the top of the plant canopy.</div><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;padding:8px 12px;background:var(--card-alt);border-radius:6px"><span style="font-size:13px;color:var(--text-muted)">Seedling</span><span class="mono" style="font-weight:700;color:var(--primary)">${state.tempUnit==="F"?"6\u201310 in":"15\u201325 cm"}</span></div><div style="display:flex;justify-content:space-between;padding:8px 12px;background:var(--card-alt);border-radius:6px"><span style="font-size:13px;color:var(--text-muted)">Vegetative</span><span class="mono" style="font-weight:700;color:var(--accent)">${state.tempUnit==="F"?"4\u20138 in":"10\u201320 cm"}</span></div>${c.stages.fruit?`<div style="display:flex;justify-content:space-between;padding:8px 12px;background:var(--card-alt);border-radius:6px"><span style="font-size:13px;color:var(--text-muted)">Fruiting</span><span class="mono" style="font-weight:700;color:var(--danger-text)">${state.tempUnit==="F"?"3\u20136 in":"8\u201315 cm"}</span></div>`:""}</div><div style="font-size:12px;color:var(--text-muted);margin-top:8px">Lower = more intense. No dimmer on most kits \u2014 height is your only control. Watch for light burn (bleached leaf tips) if too close.</div>`):mc("\u{1f4a1}","Light Requirements",`<div style="display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap"><button class="sys-btn ${state.lightSource==='led'?'active':''}" onclick="state.lightSource='led';render()">LED Panel</button><button class="sys-btn ${state.lightSource==='greenhouse'?'active':''}" onclick="state.lightSource='greenhouse';render()">Greenhouse</button><button class="sys-btn ${state.lightSource==='outdoor'?'active':''}" onclick="state.lightSource='outdoor';render()">Outdoor</button><button class="sys-btn ${state.lightSource==='window'?'active':''}" onclick="state.lightSource='window';render()">Window</button></div><div style="display:flex;align-items:baseline;gap:6px"><span class="big-num mono" style="color:var(--accent)">${state.lightSource==='led'?c.light+'h':state.lightSource==='greenhouse'?'12–16h':state.lightSource==='outdoor'?'12–16h':'6–8h'}</span><span style="font-size:14px;color:var(--text-muted)">${state.lightSource==='led'?'per day':'typical daylight'}</span></div><div style="font-size:13px;color:var(--text-muted);margin-top:6px">${state.lightSource==='led'?c.lightNote:state.lightSource==='greenhouse'?'Ideal '+c.light+'h — varies with season and latitude':state.lightSource==='outdoor'?'Ideal '+c.light+'h — seasonal variation is normal, shorter days = slower growth':'Direct sunlight through window — usually less than ideal PPFD'}</div>${state.lightSource==='led'?lightBar(c.light):state.lightSource==='window'?lightBar(7):lightBar(14)}<div style="margin-top:12px;padding:12px;background:var(--card-alt);border-radius:8px;font-size:12px;line-height:1.5;color:var(--text)">${state.lightSource==='led'?'<strong>LED Panel:</strong> Full control over photoperiod and intensity. Match recommended hours. Adjust height for intensity.':state.lightSource==='greenhouse'?'<strong>Greenhouse:</strong> Natural sunlight is fine even if you get 12–14h instead of the ideal '+c.light+'h. Plants will grow slightly slower but healthily. In winter or high latitudes, you may want supplemental LED. Watch for heat buildup in summer.':state.lightSource==='outdoor'?'<strong>Outdoor Direct Sun:</strong> Full spectrum but weather-dependent. It is completely fine if daylight is 12–14h instead of the ideal '+c.light+'h — plants just grow a bit slower. <strong>Check the weather forecast</strong> — overcast days can drop light output by 50–80%, so extended cloudy stretches will slow growth further. Protect from heavy rain, hail, and animals. Watch out for summer heat and winter frost.':'<strong>Windowsill:</strong> Usually insufficient — most windows deliver less than 200 PPFD and only 6–8h of direct light. Plants will survive but grow slowly and leggy. Best for microgreens and low-light herbs, or supplement with an LED grow bulb.'}</div>`)}
    ${mc("📏","Spacing",`<div style="font-size:22px;font-weight:600">${(state.system==="aio"||state.system==="tower")?"N/A \u2014 fixed pod layout":c.spacing}</div><div class="small-note">${state.system==="aio"?"Spacing is determined by your kit\u2019s pod slots":state.system==="tower"?"Spacing is fixed by your tower\u2019s port positions":"between plants"}</div>`)}
    ${mc("⚙️",`${sys.short} — System Setup`,sysSetupContent,true)}

function generateICS(){
  const c=getCrop(),sys=getSys(),ms=getMilestones();let evts=[];

    if(m.startDay!==m.endDay){const en=new Date(m.endDate);en.setDate(en.getDate()+1);evts.push(`BEGIN:VEVENT\r\nUID:hg-${c.id}-${state.plantDate}-ms${i}@hydrogrow\r\nDTSTART;VALUE=DATE:${icsDate(m.startDate)}\r\nDTEND;VALUE=DATE:${icsDate(en)}\r\nSUMMARY:🌱 ${c.name} — ${m.label}\r\nDESCRIPTION:${desc}\r\nBEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:${m.label}\r\nEND:VALARM\r\nEND:VEVENT`);}
    else{evts.push(`BEGIN:VEVENT\r\nUID:hg-${c.id}-${state.plantDate}-ms${i}@hydrogrow\r\nDTSTART;VALUE=DATE:${icsDate(m.startDate)}\r\nSUMMARY:🌱 ${c.name} — ${m.label}\r\nDESCRIPTION:${desc}\r\nBEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:${m.label}\r\nEND:VALARM\r\nEND:VEVENT`);}
  });
  const freq=parseInt(state.reminderFreq),td=c.harvest[1]+7;
  const sd=c.sd[state.system];
  const chkDesc=`Routine ${sys.short} check for ${c.name}:\\n\\nCheck pH (${c.pH[0]}–${c.pH[1]})\\nCheck EC (${c.ec[0]}–${c.ec[1]} mS/cm)\\nCheck water temp (${c.wTemp[0]}–${c.wTemp[1]}°F)\\nCheck water level & top off as needed\\nInspect roots & leaves\\n\\nTank: ${sd.tank}\\nCirc. Pump: ${sd.circ||'N/A'}\\nCycle: ${sd.cycle}`;
  for(let d=freq;d<=td;d+=freq){const dt=addDays(state.plantDate,d);evts.push(`BEGIN:VEVENT\r\nUID:hg-${c.id}-${state.plantDate}-chk${d}@hydrogrow\r\nDTSTART:${icsDateTime(dt,9)}\r\nDTEND:${icsDateTime(dt,9)}\r\nSUMMARY:🔍 ${c.name} — Tank Check (Day ${d})\r\nDESCRIPTION:${chkDesc}\r\nBEGIN:VALARM\r\nTRIGGER:-PT15M\r\nACTION:DISPLAY\r\nDESCRIPTION:Check your ${c.name}\r\nEND:VALARM\r\nEND:VEVENT`);}
  const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//HydroGrow//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:HydroGrow — ${c.name}\r\n${evts.join("\r\n")}\r\nEND:VCALENDAR`;
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`hydrogrow-${c.id}-plan.ics`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  const btn=document.getElementById("exportBtn");btn.textContent="✓ Downloaded — open to add to calendar";btn.classList.add("done");setTimeout(()=>{btn.textContent="📅 Download .ics Calendar File";btn.classList.remove("done");},3000);
}

// ── STAGE CHART ──
function showStageChart() {
  const c = getCrop();
  const stages = c.sr || [];
  if (!stages.length) return;

  const W = 520, H = 280, pad = {t:30,r:50,b:50,l:50};
  const cw = W-pad.l-pad.r, ch = H-pad.t-pad.b;
  const n = stages.length;
  const colW = cw / n;

  // pH chart (range 4.0 - 8.0)
  const phMin=4.0, phMax=8.0, phRange=phMax-phMin;
  const phY = v => pad.t + ch - ((v-phMin)/phRange)*ch;

  // EC chart (range 0 - max+1)
  const ecCeil = Math.ceil(Math.max(...stages.map(s=>s.ec[1]))+0.5);
  const ecY = v => pad.t + ch - (v/ecCeil)*ch;

  let phBars = "", ecBars = "", labels = "";
  stages.forEach((s, i) => {
    const x = pad.l + i*colW;
    const midX = x + colW/2;
    // pH bars
    const py1 = phY(s.pH[1]), py2 = phY(s.pH[0]);
    phBars += `<rect x="${x+8}" y="${py1}" width="${colW/2-12}" height="${py2-py1}" rx="4" fill="var(--primary)" opacity="0.7"/>`;
    phBars += `<text x="${x+colW/4+2}" y="${py1-6}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--primary)">${s.pH[1]}</text>`;
    phBars += `<text x="${x+colW/4+2}" y="${py2+14}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--primary)">${s.pH[0]}</text>`;
    // EC bars
    const ey1 = ecY(s.ec[1]), ey2 = ecY(s.ec[0]);
    ecBars += `<rect x="${x+colW/2+4}" y="${ey1}" width="${colW/2-12}" height="${ey2-ey1}" rx="4" fill="var(--accent)" opacity="0.7"/>`;
    ecBars += `<text x="${x+colW*3/4-2}" y="${ey1-6}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--accent)">${s.ec[1]}</text>`;
    ecBars += `<text x="${x+colW*3/4-2}" y="${ey2+14}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--accent)">${s.ec[0]}</text>`;
    // Stage label
    labels += `<text x="${midX}" y="${H-10}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">${s.s}</text>`;
  });

  // Grid lines
  let grid = "";
  for(let p=phMin;p<=phMax;p+=1){
    const y=phY(p);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="3,3"/>`;
  }

  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;font-family:system-ui,sans-serif">
    ${grid}
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}" stroke="var(--border)" stroke-width="1.5"/>
    <line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="var(--border)" stroke-width="1.5"/>
    ${phBars}${ecBars}${labels}
    <rect x="${pad.l}" y="6" width="10" height="10" rx="2" fill="var(--primary)" opacity="0.7"/><text x="${pad.l+14}" y="15" font-size="11" font-weight="600" fill="var(--primary)">pH Range</text>
    <rect x="${pad.l+90}" y="6" width="10" height="10" rx="2" fill="var(--accent)" opacity="0.7"/><text x="${pad.l+104}" y="15" font-size="11" font-weight="600" fill="var(--accent)">EC (mS/cm)</text>
  </svg>`;

  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeCheatSheet()">
      <div class="modal-content" style="max-width:580px;background:var(--card);color:var(--text)">
        <button class="modal-close" onclick="closeCheatSheet()">✕</button>
        <div style="text-align:center;margin-bottom:16px">
          <span style="font-size:32px">${c.icon}</span>
          <h2 style="font-size:20px;font-weight:700;margin:6px 0;color:var(--text)">${c.name} — pH & EC by Stage</h2>
          <div style="font-size:13px;color:var(--text-muted)">Optimal ranges shift as the plant matures</div>
        </div>
        ${svg}
        <div style="margin-top:16px">
          <table class="ct"><tbody>
            <tr style="background:var(--card-alt)"><td style="font-weight:700;color:var(--text)">Stage</td><td style="font-weight:700;color:var(--text)">pH</td><td style="font-weight:700;color:var(--text)">EC (mS/cm)</td></tr>
            ${stages.map(s=>`<tr><td>${s.s}</td><td>${s.pH[0]} – ${s.pH[1]}</td><td>${s.ec[0]} – ${s.ec[1]} mS/cm<br><span style="font-size:11px;color:#6b7d6b">${ecToPpm(s.ec[0])}–${ecToPpm(s.ec[1])} PPM</span></td></tr>`).join("")}
          </tbody></table>
        </div>
      </div>
    </div>`;
}

// 3-Part: General Hydroponics Flora Series ratios (ml per gallon)
// 2-Part: Standard A/B equal-ratio system (ml per gallon at reference EC)
// System efficiency multipliers - adjusts nutrient amounts by delivery method
const SYS_SCALE = {
  dwc:  {factor:1.00, label:"Baseline — roots fully submerged, standard absorption"},
  nft:  {factor:0.95, label:"Slight reduction — continuous thin film is efficient"},
  ebb:  {factor:1.05, label:"Slight increase — intermittent contact, media retention"},
  drip: {factor:1.10, label:"Higher — compensates for nutrient loss in runoff"},
  aero: {factor:0.75, label:"Significant reduction — misted roots absorb very efficiently"},
  aio:  {factor:0.65, label:"Much lower — small shared reservoir concentrates quickly"},
  kratky: {factor:1.15, label:"Higher — no top-off, nutrients concentrate as water drops"},
  tower: {factor:1.05, label:"Slight increase — recirculating drip through vertical channels"},
};

const SPEED_NOTES = {"Leafy Greens":{dwc:"Baseline speed — the standard for leafy greens",nft:"Typically 10–15% faster than DWC in warm conditions",ebb:"Similar speed to DWC — reliable and consistent",drip:"Slightly slower than DWC — substrate limits root oxygen",aero:"Typically fastest — 20–30% faster than DWC due to root oxygen",aio:"10–15% slower — small reservoir limits nutrient consistency",kratky:"Slower than active systems — no aeration means less oxygen",tower:"Similar to drip — competitive with DWC when tuned",},"Herbs":{dwc:"Baseline speed — works well for most herbs",nft:"Similar to DWC — works well for small herbs, less ideal for large ones",ebb:"Slightly slower but very consistent",drip:"Comparable to DWC — good for herbs with larger root systems",aero:"Fastest — studies show 15–20% yield increase for basil",aio:"Comparable speed — herbs are less demanding than greens",kratky:"Slightly slower but excellent flavor — low maintenance",tower:"Similar to drip — great for high-density herb production",},"Fruiting":{dwc:"Works well — keep reservoir large enough for water demand",nft:"Not ideal — insufficient root support for heavy fruiting plants",ebb:"Reliable choice — slightly slower than drip",drip:"Fastest and highest yield — best fit for fruiting crops",aero:"Works but demanding — requires precise control for fruiting stages",aio:"Poor fit — reservoir too small for fruiting crop demand",kratky:"Marginal — water depletion often limits full harvest",tower:"Compact varieties only — works but slower than drip",},"Specialty":{dwc:"Works for onions/scallions — not for microgreens",nft:"Not suitable for most specialty crops",ebb:"Excellent for microgreens — timed flooding works well",drip:"Not ideal for these crops",aero:"Can work for propagation but expensive setup",aio:"Works for compact specialty crops",kratky:"Passive tray works well for microgreens",tower:"Not suitable — needs flat trays or clusters",},};


const NUT_3PART = {
  seedling:   {micro:1.25, grow:1.25, bloom:0.5,  calmag:1.25, label:"Seedling",         ecRef:0.4},
  veg_light:  {micro:2.5,  grow:2.5,  bloom:1.0,  calmag:2.5,  label:"Early Vegetative",  ecRef:1.0},
  veg_heavy:  {micro:3.75, grow:3.75, bloom:1.25, calmag:2.5,  label:"Aggressive Vegetative", ecRef:1.8},
  transition: {micro:2.5,  grow:1.25, bloom:2.5,  calmag:2.5,  label:"Transition to Bloom", ecRef:2.0},
  bloom:      {micro:2.5,  grow:0.6,  bloom:3.75, calmag:2.5,  label:"Bloom / Fruiting",  ecRef:2.5},
  bloom_heavy:{micro:3.0,  grow:0.5,  bloom:5.0,  calmag:3.0,  label:"Heavy Fruiting",    ecRef:3.5},
};
const NUT_AB = {
  seedling:   {a:1.25, b:1.25, calmag:1.0,  label:"Seedling",         ecRef:0.4},
  veg_light:  {a:2.5,  b:2.5,  calmag:2.0,  label:"Early Vegetative",  ecRef:1.0},

function renderCalculator(crop, sys) {
  const cr = crop;
  const stages = cr.sr || [];
  const hasFruit = !!cr.stages.fruit;
  const tankSize = state.tankSize || "3";
  const selStage = state.calcStage || "seedling";
  const nutSys = state.nutSystem || "3part";
  const gal = parseFloat(tankSize) || 1;

  const stageOptions = [{v:"seedling",l:"Seedling"},{v:"veg_light",l:"Early Veg"},{v:"veg_heavy",l:"Aggressive Veg"}];
  if(hasFruit) {
    stageOptions.push({v:"transition",l:"Transition"});
    stageOptions.push({v:"bloom",l:"Bloom / Fruit"});
    stageOptions.push({v:"bloom_heavy",l:"Heavy Fruit"});
  }

  // Find the crop's target EC for this stage
  const cropStageData = stages.find(s => {
    if(selStage.startsWith("bloom")||selStage==="transition") return s.s==="Fruiting";
    if(selStage.startsWith("veg")) return s.s==="Vegetative"||s.s==="Harvest";
    return s.s==="Seedling";
  }) || stages[0];
  const targetEC = cropStageData ? (cropStageData.ec[0]+cropStageData.ec[1])/2 : 1.0;

  // Get profile and scale
  const is3 = nutSys === "3part";
  const profiles = is3 ? NUT_3PART : NUT_AB;
  const profile = profiles[selStage] || profiles.seedling;
  const sysScale = SYS_SCALE[state.system] || SYS_SCALE.dwc;
  const tapEC = parseFloat(state.tapEC) || 0;
  const effectiveTargetEC = Math.max(0.1, targetEC - tapEC);
  const baseScale = Math.max(0.3, Math.min(effectiveTargetEC / profile.ecRef, 2.5));
  const scale = baseScale * sysScale.factor;

  function nutBar(label, val, maxVal, color, note) {
    const pct = Math.min((parseFloat(val)/maxVal)*100, 100);
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
        <span style="font-size:14px;font-weight:700;color:var(--text)">${label}</span>
        <span class="mono" style="font-size:20px;font-weight:700;color:${color}">${val} ml</span>
      </div>
      ${note?`<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">${note}</div>`:""}
      <div style="height:10px;border-radius:5px;background:var(--card-alt);overflow:hidden">
        <div style="height:100%;width:${pct}%;border-radius:5px;background:${color};transition:width .3s"></div>
      </div>
    </div>`;
  }

  let nutrientBars;
  const maxBar = gal * 12;
  if (is3) {
    const micro = (profile.micro * gal * scale).toFixed(1);
    const grow = (profile.grow * gal * scale).toFixed(1);

// ── COMPANION PLANTING MATRIX ──
function getCompatibility(a, b) {
  if (a.id === b.id) return {score:100,rating:"—",color:"var(--text-muted)"};
  // pH overlap
  const phOvMin = Math.max(a.pH[0], b.pH[0]);
  const phOvMax = Math.min(a.pH[1], b.pH[1]);
  const phOv = Math.max(0, phOvMax - phOvMin);
  const phTotal = Math.max(a.pH[1]-a.pH[0], b.pH[1]-b.pH[0]) || 1;
  const phScore = (phOv / phTotal) * 100;
  // EC overlap
  const ecOvMin = Math.max(a.ec[0], b.ec[0]);
  const ecOvMax = Math.min(a.ec[1], b.ec[1]);
  const ecOv = Math.max(0, ecOvMax - ecOvMin);
  const ecTotal = Math.max(a.ec[1]-a.ec[0], b.ec[1]-b.ec[0]) || 1;
  const ecScore = (ecOv / ecTotal) * 100;
  // Temp overlap
  const wtOvMin = Math.max(a.wTemp[0], b.wTemp[0]);
  const wtOvMax = Math.min(a.wTemp[1], b.wTemp[1]);
  const wtOv = Math.max(0, wtOvMax - wtOvMin);
  const wtTotal = Math.max(a.wTemp[1]-a.wTemp[0], b.wTemp[1]-b.wTemp[0]) || 1;
  const wtScore = (wtOv / wtTotal) * 100;

  const total = Math.round(phScore*0.35 + ecScore*0.45 + wtScore*0.2);
  let rating, color;
  if (total >= 75) { rating="Excellent"; color="#2d8a4e"; }
  else if (total >= 50) { rating="Good"; color="#6aaf65"; }
  else if (total >= 30) { rating="Fair"; color="#b8860b"; }
  else { rating="Poor"; color="#a94442"; }
  return {score:total, rating, color};
}

function renderCompanions() {
  const selCrop = getCrop();
  const companions = CROPS.filter(cr=>cr.id!==selCrop.id).map(cr => {
    const compat = getCompatibility(selCrop, cr);
    return {...cr, compat};
  }).sort((a,b) => b.compat.score - a.compat.score);

  const excellent = companions.filter(c=>c.compat.rating==="Excellent");
  const good = companions.filter(c=>c.compat.rating==="Good");
  const fair = companions.filter(c=>c.compat.rating==="Fair");
  const poor = companions.filter(c=>c.compat.rating==="Poor");

  function compCard(cr) {

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:12px;background:var(--card-alt);border-radius:8px;border:1px solid var(--border)">

// ── GROW JOURNAL ──
// localStorage-backed grow tracking with multiple active grows

function loadGrows() {
  try { return JSON.parse(localStorage.getItem("hydrogrow_journal") || "[]"); }
  catch(e) { return []; }
}
function saveGrows(grows) {
  localStorage.setItem("hydrogrow_journal", JSON.stringify(grows));
}
function genId() { return "g" + Date.now() + Math.random().toString(36).substr(2,4); }

// Journal sub-views: "list" | "detail" | "new"
if (!state.journalView) state.journalView = "list";
if (!state.journalGrowId) state.journalGrowId = null;
if (!state.journalChart) state.journalChart = "pH";

function startNewGrow(name, cropId, systemId, plantDate) {
  const grows = loadGrows();
  grows.push({
    id: genId(), name: name, cropId: cropId, systemId: systemId,
    plantDate: plantDate, status: "active", entries: []
  });
  saveGrows(grows);
  state.journalView = "list";
  render();
}

function addEntry(growId, entry) {
  const grows = loadGrows();
  const g = grows.find(x => x.id === growId);
  if (g) { entry.id = genId(); g.entries.push(entry); saveGrows(grows); }
  render();
}

function showConfirm(msg, onConfirm) {
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `<div class="confirm-box">
    <div class="confirm-msg">${msg}</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" id="confirmNo">Cancel</button>
      <button class="confirm-danger" id="confirmYes">Delete</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#confirmNo").onclick = () => overlay.remove();
  overlay.querySelector("#confirmYes").onclick = () => { overlay.remove(); onConfirm(); };
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
}

function deleteGrow(growId) {
  showConfirm("Delete this grow and all its entries?", () => {
    let grows = loadGrows().filter(g => g.id !== growId);
    saveGrows(grows);
    state.journalView = "list";
    state.journalGrowId = null;
    render();
  });
}

function completeGrow(growId) {
  const grows = loadGrows();
  const g = grows.find(x => x.id === growId);
  if (g) { g.status = "completed"; saveGrows(grows); }
  render();
}

function reactivateGrow(growId) {
  const grows = loadGrows();
  const g = grows.find(x => x.id === growId);
  if (g) { g.status = "active"; saveGrows(grows); }
  render();
}

function deleteEntry(growId, entryId) {
  const grows = loadGrows();
  const g = grows.find(x => x.id === growId);
  if (g) { g.entries = g.entries.filter(e => e.id !== entryId); saveGrows(grows); }
  render();
}

function exportJournal() {
  const data = localStorage.getItem("hydrogrow_journal") || "[]";
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "hydrogrow-journal-backup.json";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importJournal(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        saveGrows(data);
        alert("Journal imported successfully! " + data.length + " grows loaded.");
        render();
      }
    } catch(err) { alert("Invalid file format."); }
  };
  reader.readAsText(file);
}

function getGrowStage(grow) {
  const crop = CROPS.find(cr => cr.id === grow.cropId);
  if (!crop) return {stage:"Unknown",day:0};
  const now = new Date();
  const planted = new Date(grow.plantDate + "T12:00:00");
  const day = Math.floor((now - planted) / (1000*60*60*24));
  if (day < 0) return {stage:"Not yet planted",day:day};
  if (day <= crop.germ[1]) return {stage:"Germination",day:day};
  if (crop.trans[1] > 0 && day <= crop.trans[1]) return {stage:"Seedling",day:day};
  if (crop.stages.fruit && day >= crop.harvest[0]) return {stage:"Fruiting / Harvest",day:day};
  if (day >= crop.harvest[0]) return {stage:"Harvest Ready",day:day};
  return {stage:"Vegetative",day:day};
}

function getIdealForStage(crop, stageName) {
  if (!crop.sr) return {pH:crop.pH, ec:crop.ec};
  const sn = stageName.toLowerCase();
  if (sn.includes("germination") || sn.includes("seedling")) {
    return crop.sr[0] || {pH:crop.pH, ec:crop.ec};
  }
  if (sn.includes("fruit") || sn.includes("harvest")) {
    const fruitStage = crop.sr.find(s => s.s === "Fruiting");
    return fruitStage || crop.sr[crop.sr.length-1] || {pH:crop.pH, ec:crop.ec};
  }
  const vegStage = crop.sr.find(s => s.s === "Vegetative" || s.s === "Harvest");
  return vegStage || crop.sr[crop.sr.length-1] || {pH:crop.pH, ec:crop.ec};
}

function drawChart(entries, metric, idealRange, label, unit, color) {
  if (entries.length < 1) return `<div style="text-align:center;color:var(--text-muted);padding:30px;font-size:13px">Add entries to see your ${label} chart</div>`;
  const W = 720, H = 260, pad = {t:25,r:25,b:45,l:60};
  const cw = W-pad.l-pad.r, ch = H-pad.t-pad.b;

  const vals = entries.map(e => e[metric]).filter(v => v != null && !isNaN(v));
  if (vals.length < 1) return `<div style="text-align:center;color:var(--text-muted);padding:30px;font-size:13px">No ${label} data yet</div>`;

  const allVals = [...vals, idealRange[0], idealRange[1]];
  let yMin = Math.min(...allVals) - 0.5;
  let yMax = Math.max(...allVals) + 0.5;
  if (metric === "waterTemp" || metric === "airTemp") { yMin = Math.floor(yMin/5)*5; yMax = Math.ceil(yMax/5)*5; }
  const yRange = yMax - yMin || 1;

  const dataEntries = entries.filter(e => e[metric] != null && !isNaN(e[metric]));
  const xScale = dataEntries.length > 1 ? cw / (dataEntries.length - 1) : cw / 2;

  const toY = v => pad.t + ch - ((v - yMin) / yRange) * ch;
  const toX = i => pad.l + (dataEntries.length > 1 ? i * xScale : cw/2);

  // Ideal range band
  const bandY1 = toY(idealRange[1]);
  const bandY2 = toY(idealRange[0]);
  let bandRect = `<rect x="${pad.l}" y="${bandY1}" width="${cw}" height="${bandY2-bandY1}" fill="${color}" opacity="0.12" rx="3"/>`;
  let bandLines = `<line x1="${pad.l}" y1="${bandY1}" x2="${W-pad.r}" y2="${bandY1}" stroke="${color}" opacity="0.3" stroke-dasharray="4,3"/>`;
  bandLines += `<line x1="${pad.l}" y1="${bandY2}" x2="${W-pad.r}" y2="${bandY2}" stroke="${color}" opacity="0.3" stroke-dasharray="4,3"/>`;

  // Range labels
  let rangeLabels = `<text x="${W-pad.r+4}" y="${bandY1+4}" font-size="9" fill="${color}" opacity="0.7">${idealRange[1]}</text>`;
  rangeLabels += `<text x="${W-pad.r+4}" y="${bandY2+4}" font-size="9" fill="${color}" opacity="0.7">${idealRange[0]}</text>`;

  // Y axis ticks
  let yTicks = "";
  const yStep = yRange <= 3 ? 0.5 : yRange <= 10 ? 1 : 5;
  for (let v = Math.ceil(yMin/yStep)*yStep; v <= yMax; v += yStep) {
    const y = toY(v);
    yTicks += `<line x1="${pad.l-4}" y1="${y}" x2="${pad.l}" y2="${y}" stroke="var(--text-muted)" opacity="0.5"/>`;
    yTicks += `<text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--text-muted)">${metric==="waterTemp"||metric==="airTemp"?Math.round(v):v.toFixed(1)}</text>`;
  }

  // Data line and points
  let linePath = "";
  let dots = "";
  dataEntries.forEach((e, i) => {
    const x = toX(i);
    const y = toY(e[metric]);
    const inRange = e[metric] >= idealRange[0] && e[metric] <= idealRange[1];
    if (i === 0) linePath += `M${x},${y}`; else linePath += ` L${x},${y}`;
    const dotColor = inRange ? color : "var(--danger-text)";
    const dotSize = inRange ? 4 : 5;
    dots += `<circle cx="${x}" cy="${y}" r="${dotSize}" fill="${dotColor}" stroke="var(--card)" stroke-width="2"/>`;
    // X label (date)
    if (dataEntries.length <= 10 || i % Math.ceil(dataEntries.length/7) === 0) {
      const d = new Date(e.date);
      const lbl = (d.getMonth()+1) + "/" + d.getDate();
      dots += `<text x="${x}" y="${H-pad.b+16}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${lbl}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;min-height:180px;font-family:system-ui,sans-serif" preserveAspectRatio="xMidYMid meet">
    ${bandRect}${bandLines}${rangeLabels}
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="var(--border)" stroke-width="1"/>
    ${yTicks}
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${pad.l-5}" y="14" text-anchor="end" font-size="10" font-weight="600" fill="${color}">${label}${unit?" ("+unit+")":""}</text>
    <rect x="${W-pad.r-110}" y="4" width="105" height="16" rx="3" fill="${color}" opacity="0.12"/>
    <text x="${W-pad.r-58}" y="15" text-anchor="middle" font-size="9" font-weight="600" fill="${color}">Ideal: ${idealRange[0]}-${idealRange[1]}${unit||""}</text>
  </svg>`;
}

function diagSetPath(path) {
  state.diagnosePath = path;
  render();
  window.scrollTo(0,0);
}

function renderDiagnose() {
  const path = state.diagnosePath;
  const el = document.getElementById("mainContent");

  // Determine current node
  let currentNode = null;
  let result = null;
  let breadcrumbs = [{label:"Start", path:[]}];

  if (path.length === 0) {
    currentNode = DIAGNOSE_TREE;
  } else if (path.length === 1) {
    currentNode = DIAGNOSE_NODES[path[0]];
    breadcrumbs.push({label: path[0]==="old"?"Old Leaves":path[0]==="new"?"New Leaves":"Whole Plant", path:[path[0]]});
  } else if (path.length === 2) {
    result = DIAGNOSE_RESULTS[path[1]];
    breadcrumbs.push({label: path[0]==="old"?"Old Leaves":path[0]==="new"?"New Leaves":"Whole Plant", path:[path[0]]});
    if(result) breadcrumbs.push({label: result.nutrient, path: path.slice()});
  }

  // Build breadcrumb trail
  const crumbHtml = breadcrumbs.map((b, i) => {
    const isLast = i === breadcrumbs.length - 1;
    const pathJson = JSON.stringify(b.path);
    return `${i>0?'<span style="color:var(--text-muted);margin:0 6px">\u203A</span>':''}${isLast?`<span style="font-weight:600;color:var(--text)">${b.label}</span>`:`<button onclick='diagSetPath(${pathJson})' style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;padding:0;font-weight:500">${b.label}</button>`}`;
  }).join("");

  if (result) {
    // Show result card
    el.innerHTML = `
      <div style="margin-bottom:16px;font-size:13px">${crumbHtml}</div>
      <div style="background:var(--card);border-radius:12px;padding:24px;border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow);margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
          <div>
            <div style="font-size:22px;font-weight:700">${result.nutrient}</div>
            <div style="display:flex;gap:8px;margin-top:4px">
              <span class="tag">${result.severity}</span>
              ${result.mobile!==null?`<span class="tag ${result.mobile?'blue':'gold'}">${result.mobile?'Mobile \u2014 shows on old leaves':'Immobile \u2014 shows on new leaves'}</span>`:''}
            </div>
          </div>
        </div>

        <div style="margin-bottom:20px">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">What It Looks Like</div>
          <div style="font-size:14px;line-height:1.6;color:var(--text)">${result.symptoms}</div>
        </div>

        <div style="background:var(--primary-light);border-radius:8px;padding:16px;margin-bottom:16px;border:1px solid var(--border)">
          <div style="font-size:12px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Check This First</div>
          <div style="font-size:14px;line-height:1.6;color:var(--text)">${result.checkFirst}</div>
        </div>

        <div style="margin-bottom:16px">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Hydroponic Fix</div>
          <div style="font-size:14px;line-height:1.6;color:var(--text);white-space:pre-line">${result.hydroFix}</div>
        </div>

        <div style="background:var(--card-alt);border-radius:8px;padding:14px;border:1px solid var(--border)">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Common Cause</div>
          <div style="font-size:14px;line-height:1.6;color:var(--text)">${result.commonCause}</div>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button onclick="diagSetPath([])" style="padding:10px 20px;border-radius:8px;border:1px solid var(--primary);background:transparent;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer">Start Over</button>
        <button onclick='diagSetPath(${JSON.stringify([path[0]])})' style="padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);font-weight:600;font-size:13px;cursor:pointer">Back to Symptoms</button>
      </div>
    `;
  } else if (currentNode) {
    // Show question with options
    el.innerHTML = `
      <div style="margin-bottom:16px;font-size:13px">${crumbHtml}</div>
      <div style="background:var(--card);border-radius:12px;padding:24px;border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow);margin-bottom:16px">
        <div style="font-size:20px;font-weight:700;margin-bottom:8px">${currentNode.question}</div>
        <div style="font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:20px">${currentNode.note}</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${currentNode.options.map(opt => {
            const newPath = JSON.stringify([...path, opt.next]);
            return `<button onclick='diagSetPath(${newPath})'
              style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card-alt);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .15s;line-height:1.4"
              onmouseover="this.style.borderColor='var(--primary)';this.style.background='var(--primary-light)'"
              onmouseout="this.style.borderColor='var(--border)';this.style.background='var(--card-alt)'">
              <span>${opt.label}</span>
            </button>`;
          }).join("")}
        </div>
      </div>
      ${path.length > 0 ? `<button onclick="diagSetPath([])" style="padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);font-weight:600;font-size:13px;cursor:pointer">Back to Start</button>` : `
      <div style="background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border);box-shadow:0 2px 8px var(--shadow)">
        <div style="font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Quick Tip</div>
        <div style="font-size:14px;line-height:1.6;color:var(--text)">Before diagnosing nutrient problems, always check <strong>pH</strong>, <strong>EC</strong>, and <strong>water temperature</strong> first. The majority of hydroponic issues are caused by pH drift or incorrect EC \u2014 not missing nutrients. A pH meter and EC meter are your two most important diagnostic tools.</div>
      </div>
      `}
    `;
  }
}
/* ======================================== END DIAGNOSE ======================================== */

function renderJournal() {
  const grows = loadGrows();

  if (state.journalView === "new") {
    renderNewGrow();
    return;
  }

  if (state.journalView === "detail" && state.journalGrowId) {
    const grow = grows.find(g => g.id === state.journalGrowId);
    if (grow) { renderGrowDetail(grow); return; }
    state.journalView = "list";
  }

  // LIST VIEW
  const active = grows.filter(g => g.status === "active");
  const completed = grows.filter(g => g.status === "completed");

  function growCard(g) {
    const crop = CROPS.find(cr => cr.id === g.cropId) || {icon:"?",name:"Unknown"};
    const sys = SYSTEMS.find(s => s.id === g.systemId) || {short:"?"};
    const stage = getGrowStage(g);
    const lastEntry = g.entries.length ? g.entries[g.entries.length-1] : null;
    return `<div onclick="state.journalView='detail';state.journalGrowId='${g.id}';render()" style="background:var(--card-alt);border-radius:10px;padding:16px;border:1px solid var(--border);cursor:pointer;transition:all .15s">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:28px">${crop.icon}</span>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:700">${g.name}</div>
          <div style="font-size:12px;color:var(--text-muted)">${crop.name} / ${sys.short} / Day ${stage.day}</div>
        </div>
        <span class="tag${g.status==='active'?' blue':''}">${stage.stage}</span>
      </div>
      <div style="display:flex;gap:16px;font-size:12px;color:var(--text-muted)">
        <span>Planted: ${new Date(g.plantDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>
        <span>${g.entries.length} entries</span>
        ${lastEntry?`<span>Last: ${new Date(lastEntry.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>`:""}
      </div>
    </div>`;
  }

  document.getElementById("mainContent").innerHTML = `
    <div class="mc">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <div class="mc-h" style="margin-bottom:0"><span style="font-size:18px">\u{1f4d3}</span><span class="mc-l">Grow Journal</span></div>
        <div style="display:flex;gap:8px">
          <button onclick="state.journalView='new';render()" style="padding:8px 18px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:600;font-size:13px;cursor:pointer">+ New Grow</button>
          <button onclick="exportJournal()" title="Download all your grow data as a JSON file for backup. You can re-import this file later to restore your journal." style="padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);font-size:12px;cursor:pointer">Export</button>
          <label title="Import a previously exported JSON backup file to restore your grow journal data." style="padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-alt);color:var(--text-muted);font-size:12px;cursor:pointer">Import<input type="file" accept=".json" onchange="importJournal(this)" style="display:none"></label>
        </div>
      </div>

      ${active.length === 0 && completed.length === 0 ? `
        <div style="text-align:center;padding:40px 20px;color:var(--text-muted)">
          <div style="font-size:40px;margin-bottom:12px">\u{1f331}</div>
          <div style="font-size:16px;font-weight:600;margin-bottom:6px">No grows yet</div>
          <div style="font-size:13px">Start tracking your first grow to log pH, EC, temperature, and compare against ideal ranges.</div>
        </div>
      ` : ""}

      ${active.length ? `
        <div style="font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">Active Grows (${active.length})</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:24px">
          ${active.map(growCard).join("")}
        </div>
      ` : ""}

      ${completed.length ? `
        <div style="font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">Completed (${completed.length})</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px">
          ${completed.map(growCard).join("")}
        </div>
      ` : ""}
    </div>`;
}
